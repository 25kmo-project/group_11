name: Deploy backend

on:
  push:
    branches: [ main, backend-linux ]
  pull_request: 
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # run the script
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST}}
        username: ${{ secrets.SERVER_USER}}
        key: ${{ secrets.SERVER_SSH}}
        script: |
          cd /home/ubuntu/group_11
          git pull origin backend-linux
          cd /home/ubuntu/group_11/linux/
          ./deploy-script.sh
