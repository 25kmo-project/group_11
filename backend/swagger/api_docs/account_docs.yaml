openapi: 3.0.0
info:
  title: Bank database API
  version: 1.0.0
  description: API documentation for a bank database
paths:
  /api/accounts:
    get:
      security:
        - bearerAuth: []
      tags:
        - Accounts
      summary: Get all accounts
      responses:
        '200':
          description: A list of accounts
        '500':
          description: Server error
    post:
      tags:
        - Accounts
      summary: Creates a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idaccount:
                  type: string
                balance:
                  type: number
                account_type:
                  type: string
                credit_limit:
                  type: number
                idowner:
                  type: integer
      responses:
        '200':
          description: Account created
        '400':
          description: All required fields were not included in request body
        '500':
          description: Server error
  /api/accounts/{idaccount}:
    get:
      tags:
        - Accounts
      summary: Get account by ID
      parameters:
        - in: path
          name: idaccount
          required: true
          schema:
            type: string
          description: The account ID
      responses:
        '200':
          description: Account found
        '404':
          description: Account not found
        '500':
          description: Server error
    put:
      tags:
        - Accounts
      summary: Update all fields for account by ID
      parameters:
        - in: path
          name: idaccount
          required: true
          schema:
            type: string
          description: The account ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idaccount:
                  type: string
                balance:
                  type: number
                account_type:
                  type: string
                credit_limit:
                  type: number
                idowner:
                  type: integer
      responses:
        '200':
          description: Account updated
        '400':
          description: All required fields were not included in request body 
        '404':
          description: Account not found
        '500':
          description: Server error or validation error
    patch:
      tags:
        - Accounts
      summary: Update specific fields for account by ID
      parameters:
        - in: path
          name: idaccount
          required: true
          schema:
            type: string
          description: The account ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                balance:
                  type: number
      responses:
        '200':
          description: Account updated
        '404':
          description: Account not found
        '500':
          description: Server error
    delete:
      tags:
        - Accounts
      summary: Delete account by ID
      parameters:
        - in: path
          name: idaccount
          required: true
          schema:
            type: string
          description: The account ID
      responses:
        '200':
          description: Account deleted
        '404':
          description: Account not found
        '500':
          description: Server error