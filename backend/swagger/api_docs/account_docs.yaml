openapi: 3.0.0
info:
  title: My Express API
  version: 1.0.0
  description: API documentation for my Express app
paths:
  /api/accounts:
    get:
      tags:
        - Accounts
      summary: Get all accounts
      responses:
        '200':
          description: A list of accounts
        '500':
          description: Server error
    post:
      tags:
        - Accounts
      summary: Create a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idaccount:
                  type: integer
                balance:
                  type: number
                account_type:
                  type: string
                credit_limit:
                  type: number
                idowner:
                  type: integer
      responses:
        '200':
          description: Account created
        '500':
          description: Server error or validation error
  /api/accounts/{idaccount}:
    get:
      tags:
        - Accounts
      summary: Get account by ID
      parameters:
        - in: path
          name: idaccount
          required: true
          schema:
            type: integer
          description: The account ID
      responses:
        '200':
          description: Account found
        '404':
          description: User not found
        '500':
          description: Server error
    put:
      tags:
        - Accounts
      summary: Update account by ID
      parameters:
        - in: path
          name: idaccount
          required: true
          schema:
            type: integer
          description: The account ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idaccount:
                  type: integer
                balance:
                  type: number
                account_type:
                  type: string
                credit_limit:
                  type: number
                idowner:
                  type: integer
      responses:
        '200':
          description: Account updated
        '500':
          description: Server error or validation error
    patch:
      tags:
        - Accounts
      summary: Update account by ID
      parameters:
        - in: path
          name: idaccount
          required: true
          schema:
            type: integer
          description: The account ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idaccount:
                  type: integer
                balance:
                  type: number
                account_type:
                  type: string
                credit_limit:
                  type: number
                idowner:
                  type: integer
      responses:
        '200':
          description: Account updated
        '500':
          description: Server error or validation error
    delete:
      tags:
        - Accounts
      summary: Delete account by ID
      parameters:
        - in: path
          name: idaccount
          required: true
          schema:
            type: integer
          description: The account ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idaccount:
                  type: integer
      responses:
        '200':
          description: Account updated
        '500':
          description: Server error or validation error