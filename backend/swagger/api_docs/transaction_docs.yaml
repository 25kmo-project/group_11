openapi: 3.0.0
info:
  title: Bank database API
  version: 1.0.0
  description: API documentation for a bank database
paths:
  /api/transaction/{idaccount}:
    get:
      tags:
        - Transactions
      summary: Get transactions by account ID
      parameters:
        - in: path
          name: idaccount
          required: true
          schema:
            type: string
          description: The account ID
      responses:
        '200':
          description: A list of transactions
        '500':
          description: Server error
  /api/transaction/{idtransaction}:
    get:
      tags:
        - Transactions
      summary: Get all transactions
      parameters:
        - in: path
          name: idtransaction
          required: true
          schema:
            type: string
          description: The transaction ID
      responses:
        '200':
          description: A list of transactions
        '500':
          description: Server error
