openapi: 3.0.0
info:
  title: Bank database API
  version: 1.0.0
  description: API documentation for a bank database
paths:
  /api/account_customer:
    get:
          security:
        - bearerAuth: []
      tags:
        - account_customer
      summary: Get all account_customer data
      responses:
        '200':
          description: A list of account_customer table
        '500':
          description: Server error
    post:
      tags:
        - account_customer
      summary: Creates a new account_customer row
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idaccount_customer:
                  type: number
                customer_id:
                  type: number
                account_id:
                  type: number
      responses:
        '200':
          description: Account created
        '400':
          description: All required fields were not included in request body
        '500':
          description: Server error
  /api/account_customer/{idaccount_customer}:
    get:
      tags:
        - account_customer
      summary: Get account by ID
      parameters:
        - in: path
          name: idaccount
          required: true
          schema:
            type: string
          description: The account ID
      responses:
        '200':
          description: Account found
        '404':
          description: Account not found
        '500':
          description: Server error
    put:
      tags:
        - account_customer
      summary: Update all fields for account by ID
      parameters:
        - in: path
          name: idaccount
          required: true
          schema:
            type: string
          description: The account ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idaccount_customer:
                  type: number
                customer_id:
                  type: number
                account_id:
                  type: number
      responses:
        '200':
          description: Account updated
        '400':
          description: All required fields were not included in request body 
        '404':
          description: Account not found
        '500':
          description: Server error or validation error
    patch:
      tags:
        - account_customer
      summary: Update specific fields for account_customer by ID
      parameters:
        - in: path
          name: idaccount
          required: true
          schema:
            type: string
          description: The account ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                balance:
                  type: number
      responses:
        '200':
          description: Account updated
        '404':
          description: Account not found
        '500':
          description: Server error
    delete:
      tags:
        - account_customer
      summary: Delete account_customer by ID
      parameters:
        - in: path
          name: idaccount_customer
          required: true
          schema:
            type: string
          description: The account_customer ID
      responses:
        '200':
          description: Account deleted
        '404':
          description: Account not found
        '500':
          description: Server error